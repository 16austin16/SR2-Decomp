[package]
name = "sr2-judge"
edition.workspace = true
version.workspace = true
publish.workspace = true

# The one shared, strict judge for ports (see docs/PORTING_RULES.md). Agents must not edit this crate.
# Build: cargo build --release -p sr2-judge --target i686-pc-windows-msvc
[[bin]]
name = "sr2-judge"
path = "src/main.rs"

[dependencies]
sr2-hook = { path = "../sr2-hook" }
iced-x86 = { version = "=1.21.0", default-features = false, features = ["std", "decoder", "instr_info"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
