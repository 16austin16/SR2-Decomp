# Overrides for callees the judge detects wrongly. One section per callee address:
#   [0x00ABCDEF]
#   ret_n = 8            # bytes the callee pops (default: read from its ret instructions)
#   args = 2             # stack dwords compared at each call (default: ret_n/4, else the add esp after the call)
#   float = true         # returns a float on ST0 (default: guessed from the call site)
#   xmm0 = true          # returns a float in XMM0
#   preserve = ["edx"]   # registers the callee leaves alone (the stub keeps them)
#   clobber = ["ecx"]    # registers the callee overwrites (the stub randomises them)
#   live_in = ["ecx"]    # registers compared at each call

# __security_check_cookie: ECX = the cookie, no stack arguments, changes no register on the normal path.
[0x00C9604F]
ret_n = 0
args = 0
live_in = ["ecx"]
preserve = ["eax", "ecx", "edx"]

# sqrtf wrapper: returns its result on ST0.
[0x0040EA20]
float = true

# Returns a float on ST0 (hkpVehicleDefaultAerodynamics::vf4 uses it).
[0x0049EE60]
float = true

# _ftol2_sse / _ftol2: convert ST0 to an integer in EAX (EDX) and pop it.
[0x00DA0140]
pop_st0 = true

[0x00DA0176]
pop_st0 = true

# weather_tod_segments_select: fills a 0x20-byte structure through its first stack argument (two
# time-of-day nodes, four weather records, two blend factors); returns AL.
[0x004DDA50]
out_arg = 0
out_size = 32
