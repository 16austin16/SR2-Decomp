[package]
name = "sr2-hook"
edition.workspace = true
version.workspace = true
publish.workspace = true

# Built as dinput8.dll: SR2_pc.exe imports DINPUT8.dll!DirectInput8Create, so
# dropping this next to the exe loads our code into the original game.
[lib]
name = "dinput8"
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
# Logs the callers of every still-unnamed virtual method (src/callers.rs).
caller-survey = []

[dependencies]
sr2-formats = { path = "../sr2-formats" }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
